name: 'PR Validation'

permissions:
  contents: read
  pull-requests: read

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened

jobs:
  pr-validation:
    if: github.actor != 'dependabot[bot]'
    uses: clouddrove/github-shared-workflows/.github/workflows/pr-checks.yml@v2
    with:
      commitlintConfig: commitlint.config.cjs
      checkLabels: true
